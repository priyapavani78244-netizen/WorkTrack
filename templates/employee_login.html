<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Login - WorkTrack</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #0f766e,
                #14b8a6
            );
        }

        /* MAIN LOGIN BOX */

        .login-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.22);
        }

        /* HEADER */

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;
            background: #ccfbf1;

            font-size: 32px;
        }

        .login-header h1 {
            margin: 0;
            color: #0f766e;
            font-size: 28px;
        }

        .login-header p {
            margin: 8px 0 0;
            color: #607d8b;
            font-size: 14px;
        }

        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            color: #37474f;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #b2dfdb;
            border-radius: 9px;

            background: #f8ffff;

            font-size: 15px;
            outline: none;

            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #0f766e;

            box-shadow:
                0 0 0 3px rgba(15, 118, 110, 0.12);
        }

        /* LOGIN BUTTON */

        .login-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 9px;

            background: #0f766e;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #115e59;

            transform: translateY(-1px);

            box-shadow:
                0 7px 18px rgba(15, 118, 110, 0.25);
        }

        /* APPLY LEAVE BUTTON */

        .apply-leave {
            display: block;
            width: 100%;

            text-align: center;

            margin-top: 14px;
            padding: 12px;

            border-radius: 9px;

            background: #ccfbf1;
            color: #0f766e;

            text-decoration: none;
            font-weight: bold;

            transition: 0.3s;
        }

        .apply-leave:hover {
            background: #99f6e4;
            transform: translateY(-1px);
        }

        /* BACK HOME */

        .back-home {
            display: block;
            width: 100%;

            text-align: center;

            margin-top: 12px;
            padding: 12px;

            border-radius: 9px;

            background: #f1f5f9;
            color: #475569;

            text-decoration: none;
            font-weight: bold;

            transition: 0.3s;
        }

        .back-home:hover {
            background: #e2e8f0;
            color: #0f766e;
        }

        /* FOOTER */

        .footer {
            text-align: center;

            margin-top: 25px;

            color: #607d8b;
            font-size: 13px;

            line-height: 1.6;
        }

        /* MOBILE */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .login-container {
                padding: 25px 20px;
            }

            .login-header h1 {
                font-size: 25px;
            }
        }

    </style>

</head>


<body>

<div class="login-container">


    <!-- HEADER -->

    <div class="login-header">

        <div class="login-icon">
            👤
        </div>

        <h1>
            Employee Login
        </h1>

        <p>
            Login to your WorkTrack account
        </p>

    </div>


    <!-- LOGIN FORM -->

    <form
        method="POST"
        action="/employee_login"
    >

        <!-- EMPLOYEE ID -->

        <div class="form-group">

            <label for="username">
                Employee ID
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter Employee ID"
                required
                autocomplete="username"
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                required
                autocomplete="current-password"
            >

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-btn"
        >
            🔐 Login
        </button>

    </form>


    <!-- APPLY LEAVE -->

    <a
        href="/apply_leave"
        class="apply-leave"
    >
        📝 Apply Leave
    </a>


    <!-- BACK TO HOME -->

    <a
        href="/"
        class="back-home"
    >
        ← Back to Home
    </a>


    <!-- FOOTER -->

    <div class="footer">

        WorkTrack

        <br>

        Employee Panel

    </div>


</div>

</body>

</html>
